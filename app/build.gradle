plugins { id 'com.android.application' }
android {
    namespace 'dev.stream.browser'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    ndkVersion '27.2.12479018'
    defaultConfig {
        applicationId 'dev.stream.browser'
        minSdk 29
        targetSdk 35
        versionCode 5
        versionName '0.3.2'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { cppFlags '-std=c++20 -fvisibility=hidden -Wall -Wextra' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs {
        useLegacyPackaging = true
        keepDebugSymbols += ['**/*.zip.so']
        excludes += ['**/armeabi-v7a/**', '**/x86/**']
    } }
    sourceSets { main { jniLibs.srcDir 'runtime/jniLibs'; assets.srcDir 'runtime/assets' } }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.all {
            if (project.hasProperty('nativeTestLibraryDirectory')) {
                systemProperty 'java.library.path', project.property('nativeTestLibraryDirectory')
                systemProperty 'stream.nativeTests', 'true'
            }
        }
    }
}
dependencies {
    implementation 'local.gecko:geckoview:160.0.20261116130455-stream2'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
